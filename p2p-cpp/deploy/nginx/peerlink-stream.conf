# TCP relay for tools/p2p-tunnel (relay-tunnel / simple-relay-server).
# Plain-text REGISTER/CONNECT — do NOT reuse HTTPS :443 (that is nginx ssl for signaling).
#
# Install:
#   sudo install -m 0644 deploy/nginx/peerlink-stream.conf /etc/nginx/peerlink-stream.conf
# Add this line near the end of /etc/nginx/nginx.conf (top level, NOT inside http { }):
#   include /etc/nginx/peerlink-stream.conf;
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# Open cloud firewall / security group: TCP 9443 (public) -> this listener.

stream {
    upstream peerlink_simple_relay {
        server 127.0.0.1:9700;
    }

    server {
        listen 9443;
        listen [::]:9443;
        proxy_pass peerlink_simple_relay;
        proxy_timeout 7d;
        proxy_connect_timeout 60s;
    }
}
