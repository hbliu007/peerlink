<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-sm">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)" rx="12"/>

  <!-- Grid pattern - brighter for dark mode -->
  <g opacity="0.08" stroke="#3b82f6" stroke-width="1">
    <line x1="0" y1="40" x2="1280" y2="40"/><line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="200" x2="1280" y2="200"/><line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="280" x2="1280" y2="280"/>
    <line x1="160" y1="0" x2="160" y2="320"/><line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/><line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/><line x1="960" y1="0" x2="960" y2="320"/>
    <line x1="1120" y1="0" x2="1120" y2="320"/>
  </g>

  <!-- Network topology - left side -->
  <g filter="url(#glow)" opacity="0.8">
    <!-- Connection lines -->
    <line x1="120" y1="100" x2="280" y2="160" stroke="#3b82f6" stroke-width="2"/>
    <line x1="120" y1="220" x2="280" y2="160" stroke="#3b82f6" stroke-width="2"/>
    <line x1="280" y1="160" x2="400" y2="100" stroke="#10b981" stroke-width="2"/>
    <line x1="280" y1="160" x2="400" y2="220" stroke="#10b981" stroke-width="2"/>
    <line x1="400" y1="100" x2="500" y2="160" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="400" y1="220" x2="500" y2="160" stroke="#8b5cf6" stroke-width="2"/>
    <!-- Nodes -->
    <circle cx="120" cy="100" r="10" fill="#3b82f6"/><circle cx="120" cy="100" r="4" fill="#fff" opacity="0.9"/>
    <circle cx="120" cy="220" r="10" fill="#3b82f6"/><circle cx="120" cy="220" r="4" fill="#fff" opacity="0.9"/>
    <circle cx="280" cy="160" r="14" fill="url(#green)"/><circle cx="280" cy="160" r="6" fill="#fff" opacity="0.95"/>
    <circle cx="400" cy="100" r="10" fill="#8b5cf6"/><circle cx="400" cy="100" r="4" fill="#fff" opacity="0.9"/>
    <circle cx="400" cy="220" r="10" fill="#8b5cf6"/><circle cx="400" cy="220" r="4" fill="#fff" opacity="0.9"/>
    <circle cx="500" cy="160" r="8" fill="#f59e0b"/><circle cx="500" cy="160" r="3" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Data flow particles -->
  <circle r="4" fill="#3b82f6" filter="url(#glow-sm)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M120,100 L280,160 L400,100 L500,160"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#10b981" filter="url(#glow-sm)">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M120,220 L280,160 L400,220 L500,160" begin="0.8s"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.5s" repeatCount="indefinite" begin="0.8s"/>
  </circle>

  <!-- Logo area -->
  <g transform="translate(600, 60)">
    <rect x="0" y="0" width="56" height="56" fill="#020617" rx="12" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="14" cy="14" r="7" fill="#3b82f6" filter="url(#glow-sm)"/>
    <circle cx="42" cy="14" r="7" fill="#3b82f6" filter="url(#glow-sm)"/>
    <circle cx="14" cy="42" r="7" fill="#8b5cf6" filter="url(#glow-sm)"/>
    <circle cx="42" cy="42" r="7" fill="#8b5cf6" filter="url(#glow-sm)"/>
    <circle cx="28" cy="28" r="9" fill="url(#green)" filter="url(#glow-sm)"/>
    <circle cx="14" cy="14" r="3" fill="#fff" opacity="0.9"/>
    <circle cx="42" cy="14" r="3" fill="#fff" opacity="0.9"/>
    <circle cx="14" cy="42" r="3" fill="#fff" opacity="0.9"/>
    <circle cx="42" cy="42" r="3" fill="#fff" opacity="0.9"/>
    <circle cx="28" cy="28" r="4" fill="#fff" opacity="0.95"/>
    <line x1="14" y1="14" x2="28" y2="28" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <line x1="42" y1="14" x2="28" y2="28" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <line x1="14" y1="42" x2="28" y2="28" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>
    <line x1="42" y1="42" x2="28" y2="28" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="670" y="98" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5">PeerLink</text>

  <!-- Tagline -->
  <text x="670" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="18" fill="#94a3b8" letter-spacing="0.3">Open Source P2P Secure Access Platform</text>

  <!-- Feature pills -->
  <g transform="translate(600, 170)">
    <rect x="0" y="0" width="120" height="32" rx="16" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="60" y="21" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" fill="#60a5fa" text-anchor="middle" font-weight="600">3-Layer NAT</text>

    <rect x="134" y="0" width="140" height="32" rx="16" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1.5"/>
    <text x="204" y="21" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" fill="#34d399" text-anchor="middle" font-weight="600">Zero-Trust E2EE</text>

    <rect x="288" y="0" width="120" height="32" rx="16" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="348" y="21" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" fill="#a78bfa" text-anchor="middle" font-weight="600">C++20 Native</text>
  </g>

  <!-- Stats bar -->
  <g transform="translate(600, 240)">
    <text x="0" y="0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="800" fill="#60a5fa">500+</text>
    <text x="0" y="22" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" fill="#94a3b8">Mbps Throughput</text>

    <text x="150" y="0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="800" fill="#34d399">99%+</text>
    <text x="150" y="22" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" fill="#94a3b8">Connect Rate</text>

    <text x="290" y="0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="800" fill="#fbbf24">&lt;2s</text>
    <text x="290" y="22" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" fill="#94a3b8">Setup Time</text>

    <text x="410" y="0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="800" fill="#a78bfa">80%</text>
    <text x="410" y="22" font-family="-apple-system,Blink-systemFont,Segoe UI,Roboto,sans-serif" font-size="11" fill="#94a3b8">Test Coverage</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="316" width="1280" height="4" fill="url(#accent)" rx="2"/>
</svg>
